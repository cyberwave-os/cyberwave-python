[tool.poetry]
name = "cyberwave"
version = "0.7.4"
description = "Python SDK for Cyberwave"
authors = [
    "Simone Di Somma <sdisomma@cyberwave.com>",
    "Vittorio Banfi <vbanfi@cyberwave.com>",
    "Cyberwave Team <info@cyberwave.com>",
]
readme = "README.md"
packages = [{ include = "cyberwave" }]
include = [
    { path = "cyberwave/rest", format = ["sdist", "wheel"] },
    # Gitignored CI build stamp; poetry drops VCS-ignored files unless listed.
    { path = "cyberwave/_build_version.py", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10" # Required by av package (>=3.10)
# The SDK holds no rotation maths of its own: `data/fusion.py`, `placement.py`,
# `schema.py` and `twin.py` all call the shared geometry core. It reaches it
# through the lazy `cyberwave/_geometry.py` shim, so `import cyberwave` does not
# pull in a native library for a consumer that never touches a rotation -- but
# the dependency is real, and undeclared it would raise ImportError from every
# rotation entry point of a released SDK.
#
# Platform wheels (cp310-cp314 on manylinux x86_64/aarch64, macOS arm64/x86_64
# and Windows AMD64) are on PyPI from 0.2.0, so this resolves for a plain
# `pip install cyberwave`. The minor version is the core's ABI/binding pin: an
# incompatible surface change bumps it, which is why the ceiling is <0.3.0.
cyberwave-geometry = ">=0.2.0,<0.3.0"
# Payload contracts shared with the backend, edge nodes and simulator. Pure
# Python (pydantic + pyyaml), published from the public mirror
# cyberwave-os/cyberwave-contracts. Declared ahead of use: the SDK does not
# import it yet, because drivers and CI use the SDK tree from source on top of a
# base image built from the last *published* SDK, which must carry this
# dependency first. The source_type constants in cyberwave/constants.py are
# checked against it by tests and the conformance monitor until then. The
# minor version is the contract line: a breaking schema change bumps it, hence
# the ceiling. The dev/staging SDK prerelease rewrites this line to that train's
# prerelease window (see sdk-python-test-and-release.yml).
cyberwave-contracts = ">=0.1.0,<0.2.0"
# Core dependencies for REST API client
urllib3 = "^2.1.0"
python-dateutil = "^2.8.2"
pydantic = "^2"
typing-extensions = "^4.7.1"
# YAML manifest support
pyyaml = ">=6.0"
# MQTT dependencies
paho-mqtt = "^2.1.0"
# numpy (>=2.2 required by pin/cmeel-boost for Python 3.10+)
numpy = ">=1.26.0"
# Optional image annotation/rendering dependency
pillow = { version = ">=10.0.0", optional = true }
# Optional schedule trigger support for edge workers
croniter = { version = ">=6.2.2", optional = true }
# Optional camera streaming dependencies. twin.camera[...].get_video()
# (IncomingVideoStream) lazy-imports this via consumers/__init__.py's
# __getattr__, so it's only required when video is actually used.
aiortc = { version = "^1.14.0", optional = true }
av = { version = "^16.0.1", optional = true }
# Headless OpenCV for vision/ML/camera/data extras (no GUI libs).
opencv-python-headless = { version = "^4.8.0", optional = true }
# Optional recording-data reader dependency. Recording.read_robot()/read_depth()/
# read_pointcloud() lazy-import this (managers/recordings.py); only required to read
# fetched recordings.
pyarrow = { version = ">=14.0.0", optional = true }
# Optional host microphone capture dependencies
sounddevice = { version = ">=0.5.2", optional = true }
pyudev = { version = ">=0.24.3", optional = true }
# Note: cyberwave-video-sync is installed separately via CI scripts (private registry)
# Optional Zenoh data-bus dependency
eclipse-zenoh = { version = ">=1.0.0", optional = true }
# Optional ML runtime dependencies
# Upper-bounded: >=8.0.0 exposes 796 releases, each pinning its own torch /
# opencv / numpy set, which is the bulk of the resolve. Only ``YOLO`` is
# used, stable since 8.0.0, so the floor costs nothing.
#
# Capped below 8.4.171: with it in the graph, Poetry 2.4.3 crashes mid-solve
# (KeyError: Package('nvidia-cufile', ...) in Solver._aggregate_solved_packages)
# while merging the override branches torch's cuda-toolkit extras force. Poetry
# solves every extra even for `poetry install --extras "camera speaker"`, so
# this broke the SDK CI install outright. Raise once `poetry lock` resolves.
ultralytics = { version = ">=8.4,<8.4.171", optional = true }
# Not used directly -- pulled transitively by ultralytics/torchaudio/silero-vad.
# Declared only to cap it: torch>=2.11.0 switched its Linux CUDA deps to a
# single `cuda-toolkit[...]==13.0.x` meta-package whose per-release sub-pins
# (nvidia-nvjitlink, nvidia-cusparse, ...) conflict across the override-
# compatibility paths Poetry tries when solving it alongside everything else
# here, crashing `poetry lock` with a KeyError in solver.py's
# _aggregate_solved_packages rather than a normal version error. 2.10.0 is
# the last release on the old, individually-pinned nvidia-*-cu12 scheme.
torch = { version = "<2.11.0", optional = true }
onnxruntime = { version = ">=1.16.0", optional = true }
tflite-runtime = { version = ">=2.14.0", optional = true }
pywhispercpp = { version = "1.4.1", optional = true }
faster-whisper = { version = ">=1.1.1", optional = true }
# Optional wake word detection dependency
openwakeword = { version = ">=0.6.0", optional = true }
# Optional audio workflow dependencies (Silero VAD, etc.)
silero-vad = { version = ">=6.0", optional = true }
torchaudio = { version = ">=2.0.0", optional = true }
# Optional fuzzy text matching for workflow fuzzy_matcher nodes
rapidfuzz = { version = ">=3.0.0", optional = true }
# Optional 1D/2D barcode decoding for workflow barcode_reader nodes.
# Apache-2.0; prebuilt wheels for manylinux x86_64 / aarch64 / musllinux /
# macOS / Windows. Lightweight enough for Raspberry Pi (~few MB native + numpy).
zxing-cpp = { version = "3.0.0", optional = true }
# Optional robot-arm kinematics (FK/IK) via pinocchio. Pulls numpy>=2.2
# transitively for Python 3.10+ (cmeel-boost requirement).
pin = { version = ">=3.0.0", optional = true }
# Optional trapezoidal motion generation for JointController (driver/control).
scipy = { version = ">=1.10", optional = true }

[tool.poetry.extras]
image = ["pillow"]
schedule = ["croniter"]
camera = ["aiortc", "av", "opencv-python-headless"]
microphone = ["aiortc", "av", "sounddevice", "pyudev"]
speaker = ["aiortc", "av", "sounddevice", "pyudev"]
realsense = ["aiortc", "av", "opencv-python-headless", "pyrealsense2"]
zenoh = ["eclipse-zenoh"]
data = ["eclipse-zenoh", "opencv-python-headless", "pyarrow"]
ml = ["ultralytics", "torch"]
ml-onnx = ["onnxruntime"]
ml-opencv = ["opencv-python-headless"]
ml-tflite = ["tflite-runtime"]
ml-stt = ["pywhispercpp"]
ml-stt-faster = ["faster-whisper"]
ml-wakeword = ["openwakeword", "onnxruntime"]
# Silero VAD only (Audio Assistant). Torch is pulled transitively by silero-vad;
# do not add torchaudio here — it is unused by workflow codegen and bloats Pi images.
ml-audio = ["silero-vad", "torch"]
fuzzy-match = ["rapidfuzz"]
# 1D/2D barcode decoding (workflow ``barcode_reader`` node). Permissively
# licensed (Apache-2.0); wheels are prebuilt for Pi-class hardware so this
# adds a few MB to the image without a system package or build toolchain.
barcode = ["zxing-cpp"]
# Robot-arm kinematics (BaseKinematics / ArmCapabilityMixin). pinocchio + numpy.
# scipy powers the default trapezoidal JointController motion generator.
drivers = ["pin", "scipy"]
# Eye-in-hand camera calibration (``cyberwave.calibration``). Needs cv2.aruco and
# cv2.calibrateHandEye, both in main OpenCV modules since 4.7 — no contrib build.
# Pair with the ``drivers`` extra to derive gripper poses from joint angles.
calibration = ["opencv-python-headless"]
# Hailo HEF support runs on the worker container; the ``hailo_platform`` wheel
# ships out-of-band with HailoRT (the .deb installs it into the system
# site-packages alongside the kernel-matched driver), so this extra is an
# opt-in marker only — no PyPI wheel is resolved.
ml-hailo = []
# Vision / detection — unrelated to speech workflows.
ml-all-vision = [
    "ultralytics",
    "torch",
    "onnxruntime",
    "opencv-python-headless",
    "tflite-runtime",
]
# Speech / voice-assistant — every audio workflow + STT runtime dep (fat image / CI).
ml-all-audio = [
    "openwakeword",
    "onnxruntime",
    "pywhispercpp",
    "faster-whisper",
    "silero-vad",
    "torch",
    "torchaudio",
    "rapidfuzz",
]
# Union of ml-all-vision + ml-all-audio (all optional ML deps for workflow/catalog).
# Includes torchaudio (declared optional dep; not in minimal ml-audio extra).
# Per-model catalog entries still declare one minimal extra (ml-stt, ml-stt-faster, …).
ml-all = [
    "ultralytics",
    "torch",
    "onnxruntime",
    "opencv-python-headless",
    "tflite-runtime",
    "openwakeword",
    "pywhispercpp",
    "faster-whisper",
    "silero-vad",
    "torchaudio",
    "rapidfuzz",
    "zxing-cpp",
]
onnx = ["onnxruntime"]
tflite = ["tflite-runtime"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.1"
pytest-cov = "^2.8.1"
pytest-asyncio = "^0.23"
pytest-xdist = "^3.5"
mypy = "^1.5"
types-python-dateutil = "^2.8.19.14"
croniter = ">=6.2.2"
pillow = ">=10.0.0"

[tool.poetry.scripts]
cyberwave-generate-stubs = "cyberwave.stubs_generator:main"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    # pytest-asyncio 0.23 calls this on every fixture for every test it collects. On
    # Python 3.14 that is millions of recorded warnings, which stalls collection
    # under xdist. Drop once pytest-asyncio is >= 0.25 (needs pytest >= 8.2).
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio.plugin",
]
markers = [
    "hailo: requires a Hailo accelerator (/dev/hailo0) and hailo_platform; skipped by default on x86 CI",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
